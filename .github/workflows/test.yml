name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Network data integrity
        run: node tests/network.test.mjs

      - name: Puzzle sources agreement (today.json ↔ puzzle-lookup.json ↔ index.html)
        run: node tests/puzzle-sources.test.mjs

      - name: Dijkstra admissibility (published "optimal" is not beatable)
        run: node tests/dijkstra_optimal.test.mjs

      - name: Wait-time lookups (direction, Circle pivots, branch resolution)
        run: node tests/wait_times.test.mjs

      - name: Result card end-to-end (snapshot, breakdown, totals)
        run: node tests/wait_times_e2e.test.mjs

      - name: Scoring invariants (one cost model; no beatable optimal)
        run: node tests/scoring_invariants.test.mjs

      - name: Day keys (London clock for puzzle AND progress; stale-result guard)
        run: node tests/day_keys.test.mjs
